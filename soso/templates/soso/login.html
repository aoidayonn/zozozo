{% extends "soso/base.html" %}
{% load static %}

{% block title %}ログイン{% endblock %}

{% block content %}
    <div class="content">
        <h3>ログインしてください。</h3>

        {% if error %}
        <p style="color:red;">{{ error }}</p>
        {% endif %}

        <div class="form">
            <form action="{% url 'soso:user_login' %}" method="POST">
                {% csrf_token %}
                <table>
                    {{ form.as_table }}
                </table>
                <input type="submit" value="ログイン" /><br>
                <a href="{% url 'soso:user_create' %}">会員登録</a>
            </form>
        </div>

        <br>
        <a href="{% url 'soso:top_page' %}">トップページへ</a>
    </div>
    {% endblock %}
