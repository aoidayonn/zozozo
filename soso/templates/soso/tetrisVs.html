{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <title>🎮 対戦中</title>
    <link rel="stylesheet" type="text/css" href="{% static 'soso/css/zozo.css' %}" />
    <style>
        .vs-wrapper {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .player-area {
            text-align: center;
        }

        .player-label {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        canvas.game {
            background: #fafafa;
            border: 3px solid #111;
            border-radius: 8px;
        }

        canvas.opponent {
            border-color: #888;
            opacity: 0.85;
        }

        .vs-status {
            background: #111;
            color: #fff;
            padding: 12px 24px;
            border-radius: 980px;
            font-size: 1.4rem;
            font-weight: 700;
            margin: 20px auto;
            display: inline-block;
        }

        .vs-status.waiting { background: #888; }
        .vs-status.playing { background: #27ae60; }
        .vs-status.win { background: #f5a623; }
        .vs-status.lose { background: #c0392b; }

        .vs-info {
            margin-top: 8px;
            font-size: 1.4rem;
        }

        /* ── サイドバー（自分用） ── */
        .my-area {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .sidebar-box {
            background: #fff;
            border: 2px solid #111;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .sidebar-box h4 {
            margin: 0 0 8px 0;
            padding: 0;
            border: none;
            font-size: 1.2rem;
            color: #111;
        }

        .sidebar-box .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #111;
        }

        .preview-canvas {
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .controls-info {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-top: 12px;
        }

        .controls-info kbd {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 1px 6px;
            font-family: monospace;
            font-weight: 700;
            box-shadow: 0 1px 0 #ccc;
            font-size: 1rem;
        }

        @media (max-width: 800px) {
            .vs-wrapper { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="content">
        <h3>🎮 ねこテトリス対戦</h3>
        <p>合言葉: <strong>{{ room_name }}</strong></p>

        <div id="status" class="vs-status waiting">相手を待っています...</div>

        <div class="vs-wrapper">
            <!-- 自分エリア -->
            <div class="player-area">
                <div class="player-label">YOU 🐱</div>
                <div class="my-area">
                    <canvas id="my-canvas" class="game" width="240" height="480"></canvas>
                    <div>
                        <div class="sidebar-box">
                            <h4>SCORE</h4>
                            <div class="value" id="my-score">0</div>
                        </div>
                        <div class="sidebar-box">
                            <h4>LINES</h4>
                            <div class="value" id="my-lines">0</div>
                        </div>
                        <div class="sidebar-box">
                            <h4>NEXT</h4>
                            <canvas id="next-canvas" class="preview-canvas" width="80" height="80"></canvas>
                        </div>
                        <div class="sidebar-box">
                            <h4>HOLD</h4>
                            <canvas id="hold-canvas" class="preview-canvas" width="80" height="80"></canvas>
                        </div>
                    </div>
                </div>
                <div class="controls-info">
                    <kbd>←</kbd><kbd>→</kbd>移動 / <kbd>↑</kbd>回転 / <kbd>↓</kbd>加速<br>
                    <kbd>Space</kbd>ハードドロップ / <kbd>C</kbd>ホールド / <kbd>P</kbd>一時停止
                </div>
            </div>

            <!-- 相手エリア -->
            <div class="player-area">
                <div class="player-label">OPPONENT 🐈</div>
                <canvas id="opp-canvas" class="game opponent" width="240" height="480"></canvas>
                <div class="vs-info">
                    SCORE: <span id="opp-score">0</span><br>
                    LINES: <span id="opp-lines">0</span>
                </div>
            </div>
        </div>

        <br>
        <a href="{% url 'soso:tetris_lobby' %}">ロビーに戻る</a>
    </div>

<script>
(function() {
    var COLS = 10;
    var ROWS = 20;
    var BLOCK_SIZE = 24;
    var CAT_EMOJIS = ["🐱", "😼", "🙀", "😺", "😸", "😻", "😹"];

    var myCanvas = document.getElementById("my-canvas");
    var myCtx = myCanvas.getContext("2d");
    var oppCanvas = document.getElementById("opp-canvas");
    var oppCtx = oppCanvas.getContext("2d");
    var nextCanvas = document.getElementById("next-canvas");
    var nextCtx = nextCanvas.getContext("2d");
    var holdCanvas = document.getElementById("hold-canvas");
    var holdCtx = holdCanvas.getContext("2d");

    var SHAPES = [
        { shape: [[1,1,1,1]], color: "#FFB7C5" },
        { shape: [[1,1],[1,1]], color: "#FFD966" },
        { shape: [[0,1,0],[1,1,1]], color: "#B4A7D6" },
        { shape: [[0,1,1],[1,1,0]], color: "#A8D8B9" },
        { shape: [[1,1,0],[0,1,1]], color: "#F4A6A6" },
        { shape: [[1,0],[1,0],[1,1]], color: "#F9B572" },
        { shape: [[0,1],[0,1],[1,1]], color: "#9BCDD2" }
    ];

    var board = [];
    var oppBoard = [];
    var currentPiece = null;
    var nextPiece = null;
    var holdPiece = null;
    var holdUsed = false;
    var score = 0;
    var lines = 0;
    var oppScore = 0;
    var oppLines = 0;
    var dropCounter = 0;
    var dropInterval = 800;
    var softDropping = false;
    var lastTime = 0;
    var gameStarted = false;
    var gameOver = false;
    var paused = false;
    var imLost = false;
    var oppLost = false;

    /* ── WebSocket接続 ── */
    var roomName = "{{ room_name }}";
    var wsProtocol = window.location.protocol === "https:" ? "wss" : "ws";
    var ws = new WebSocket(wsProtocol + "://" + window.location.host + "/ws/tetris/" + roomName + "/");

    ws.onopen = function() {
        console.log("接続成功");
    };

    ws.onmessage = function(e) {
        var data = JSON.parse(e.data);

        if (data.type === "joined") {
            if (data.total === 1) {
                setStatus("相手を待っています...", "waiting");
            }
        } else if (data.type === "game_start") {
            setStatus("対戦開始！", "playing");
            startGame();
        } else if (data.type === "board") {
            oppBoard = data.board;
            oppScore = data.score;
            oppLines = data.lines;
            document.getElementById("opp-score").textContent = oppScore;
            document.getElementById("opp-lines").textContent = oppLines;
        } else if (data.type === "game_over") {
            oppLost = true;
            if (!imLost) {
                setStatus("🎉 勝利！", "win");
                gameOver = true;

                /* サーバーにポイント加算リクエスト */
                fetch("/soso/tetris/win/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": getCookie("csrftoken")
                    },
                    body: JSON.stringify({})
                })
                .then(function(res) { return res.json(); })
                .then(function(d) {
                    if (d.success) {
                        showWinModal(d.points, d.total_wins);
                    }
                })
                .catch(function(err) {
                    console.error("通信エラー:", err);
                });
            }
        } else if (data.type === "opponent_left") {
            setStatus("相手が退出しました", "waiting");
            gameOver = true;
        }
    };

    ws.onclose = function() {
        setStatus("接続が切れました", "waiting");
    };

    function setStatus(text, cls) {
        var el = document.getElementById("status");
        el.textContent = text;
        el.className = "vs-status " + cls;
    }

    function initBoard() {
        board = [];
        for (var r = 0; r < ROWS; r++) {
            var row = [];
            for (var c = 0; c < COLS; c++) row.push(null);
            board.push(row);
        }
        oppBoard = JSON.parse(JSON.stringify(board));
    }

    function randomPiece() {
        var idx = Math.floor(Math.random() * SHAPES.length);
        var template = SHAPES[idx];
        var emoji = CAT_EMOJIS[Math.floor(Math.random() * CAT_EMOJIS.length)];
        var shape = template.shape.map(function(row) { return row.slice(); });
        return {
            shape: shape, color: template.color, emoji: emoji,
            x: Math.floor((COLS - shape[0].length) / 2), y: 0
        };
    }

    function collide(piece, dx, dy, newShape) {
        var shape = newShape || piece.shape;
        for (var r = 0; r < shape.length; r++) {
            for (var c = 0; c < shape[r].length; c++) {
                if (!shape[r][c]) continue;
                var nx = piece.x + c + dx;
                var ny = piece.y + r + dy;
                if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
                if (ny >= 0 && board[ny][nx]) return true;
            }
        }
        return false;
    }

    function mergePiece() {
        for (var r = 0; r < currentPiece.shape.length; r++) {
            for (var c = 0; c < currentPiece.shape[r].length; c++) {
                if (currentPiece.shape[r][c]) {
                    var x = currentPiece.x + c;
                    var y = currentPiece.y + r;
                    if (y >= 0) {
                        board[y][x] = { color: currentPiece.color, emoji: currentPiece.emoji };
                    }
                }
            }
        }
    }

    function clearLines() {
        var cleared = 0;
        for (var r = ROWS - 1; r >= 0; r--) {
            var full = true;
            for (var c = 0; c < COLS; c++) {
                if (!board[r][c]) { full = false; break; }
            }
            if (full) {
                board.splice(r, 1);
                var newRow = [];
                for (var i = 0; i < COLS; i++) newRow.push(null);
                board.unshift(newRow);
                cleared++;
                r++;
            }
        }
        if (cleared > 0) {
            score += [0,100,300,500,800][cleared];
            lines += cleared;
            document.getElementById("my-score").textContent = score;
            document.getElementById("my-lines").textContent = lines;
            dropInterval = Math.max(100, 800 - Math.floor(lines/5) * 60);
        }
    }

    function rotate(piece) {
        var shape = piece.shape;
        var rotated = [];
        for (var c = 0; c < shape[0].length; c++) {
            var newRow = [];
            for (var r = shape.length - 1; r >= 0; r--) newRow.push(shape[r][c]);
            rotated.push(newRow);
        }
        if (!collide(piece, 0, 0, rotated)) piece.shape = rotated;
    }

    function spawnNext() {
        currentPiece = nextPiece;
        nextPiece = randomPiece();
        holdUsed = false;
        if (collide(currentPiece, 0, 0)) {
            imLost = true;
            gameOver = true;
            if (!oppLost) {
                setStatus("😿 GAME OVER", "lose");
            }
            ws.send(JSON.stringify({ type: "game_over" }));
        }
    }

    function drop() {
        if (!collide(currentPiece, 0, 1)) {
            currentPiece.y++;
        } else {
            mergePiece();
            clearLines();
            spawnNext();
        }
        dropCounter = 0;
        sendBoardState();
    }

    function hardDrop() {
        var dropDist = 0;
        while (!collide(currentPiece, 0, 1)) {
            currentPiece.y++;
            dropDist++;
        }
        score += dropDist * 2;
        document.getElementById("my-score").textContent = score;
        drop();
    }

    /* ── ホールド ── */
    function holdCurrent() {
        if (holdUsed) return;
        holdUsed = true;

        if (holdPiece === null) {
            holdPiece = {
                shape: currentPiece.shape.map(function(row) { return row.slice(); }),
                color: currentPiece.color,
                emoji: currentPiece.emoji
            };
            currentPiece = nextPiece;
            nextPiece = randomPiece();
        } else {
            var swap = {
                shape: holdPiece.shape,
                color: holdPiece.color,
                emoji: holdPiece.emoji,
                x: Math.floor((COLS - holdPiece.shape[0].length) / 2),
                y: 0
            };
            holdPiece = {
                shape: currentPiece.shape.map(function(row) { return row.slice(); }),
                color: currentPiece.color,
                emoji: currentPiece.emoji
            };
            currentPiece = swap;
        }
    }

    /* ── 描画 ── */
    function drawCell(ctx, color, x, y, emoji) {
        ctx.fillStyle = color;
        ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
        ctx.strokeStyle = "rgba(0,0,0,0.2)";
        ctx.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
        ctx.font = "16px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#000";
        ctx.fillText(emoji, x * BLOCK_SIZE + BLOCK_SIZE/2, y * BLOCK_SIZE + BLOCK_SIZE/2);
    }

    function drawBoard(ctx, canvas, bd, piece) {
        ctx.fillStyle = "#fafafa";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#e8e8e8";
        for (var i = 0; i <= COLS; i++) {
            ctx.beginPath();
            ctx.moveTo(i * BLOCK_SIZE, 0);
            ctx.lineTo(i * BLOCK_SIZE, canvas.height);
            ctx.stroke();
        }
        for (var j = 0; j <= ROWS; j++) {
            ctx.beginPath();
            ctx.moveTo(0, j * BLOCK_SIZE);
            ctx.lineTo(canvas.width, j * BLOCK_SIZE);
            ctx.stroke();
        }

        for (var r = 0; r < ROWS; r++) {
            for (var c = 0; c < COLS; c++) {
                if (bd[r] && bd[r][c]) drawCell(ctx, bd[r][c].color, c, r, bd[r][c].emoji);
            }
        }

        if (piece) {
            for (var pr = 0; pr < piece.shape.length; pr++) {
                for (var pc = 0; pc < piece.shape[pr].length; pc++) {
                    if (piece.shape[pr][pc]) {
                        drawCell(ctx, piece.color, piece.x + pc, piece.y + pr, piece.emoji);
                    }
                }
            }
        }
    }

    /* ── NEXT / HOLD プレビュー ── */
    function drawPreview(targetCtx, targetCanvas, piece, faded) {
        targetCtx.fillStyle = "#fafafa";
        targetCtx.fillRect(0, 0, targetCanvas.width, targetCanvas.height);
        if (!piece) return;

        var size = 16;
        var offsetX = (targetCanvas.width - piece.shape[0].length * size) / 2;
        var offsetY = (targetCanvas.height - piece.shape.length * size) / 2;

        targetCtx.globalAlpha = faded ? 0.4 : 1;

        for (var r = 0; r < piece.shape.length; r++) {
            for (var c = 0; c < piece.shape[r].length; c++) {
                if (piece.shape[r][c]) {
                    targetCtx.fillStyle = piece.color;
                    targetCtx.fillRect(offsetX + c * size, offsetY + r * size, size, size);
                    targetCtx.strokeStyle = "rgba(0,0,0,0.2)";
                    targetCtx.strokeRect(offsetX + c * size, offsetY + r * size, size, size);
                    targetCtx.font = "12px sans-serif";
                    targetCtx.textAlign = "center";
                    targetCtx.textBaseline = "middle";
                    targetCtx.fillStyle = "#000";
                    targetCtx.fillText(
                        piece.emoji,
                        offsetX + c * size + size/2,
                        offsetY + r * size + size/2
                    );
                }
            }
        }
        targetCtx.globalAlpha = 1;
    }

    /* ── 盤面送信（間引き） ── */
    var lastSendTime = 0;
    function sendBoardState() {
        var now = Date.now();
        if (now - lastSendTime < 100) return;
        lastSendTime = now;

        ws.send(JSON.stringify({
            type: "board",
            board: board,
            score: score,
            lines: lines
        }));
    }

    /* ── キー操作 ── */
    document.addEventListener("keydown", function(e) {
        if (!gameStarted || gameOver) return;

        if (e.key === "p" || e.key === "P") {
            paused = !paused;
            return;
        }
        if (paused) return;

        if (e.key === "ArrowLeft") {
            if (!collide(currentPiece, -1, 0)) currentPiece.x--;
            e.preventDefault();
        } else if (e.key === "ArrowRight") {
            if (!collide(currentPiece, 1, 0)) currentPiece.x++;
            e.preventDefault();
        } else if (e.key === "ArrowDown") {
            softDropping = true;
            e.preventDefault();
        } else if (e.key === "ArrowUp") {
            rotate(currentPiece);
            e.preventDefault();
        } else if (e.key === " ") {
            hardDrop();
            e.preventDefault();
        } else if (e.key === "c" || e.key === "C") {
            holdCurrent();
            e.preventDefault();
        }
    });

    document.addEventListener("keyup", function(e) {
        if (e.key === "ArrowDown") softDropping = false;
    });

    /* ── メインループ ── */
    function update(time) {
        if (gameOver) {
            drawBoard(myCtx, myCanvas, board, currentPiece);
            drawBoard(oppCtx, oppCanvas, oppBoard, null);
            return;
        }
        if (paused) {
            requestAnimationFrame(update);
            return;
        }

        var dt = time - lastTime;
        lastTime = time;
        dropCounter += dt;

        var interval = softDropping ? 50 : dropInterval;
        if (dropCounter > interval) drop();

        drawBoard(myCtx, myCanvas, board, currentPiece);
        drawBoard(oppCtx, oppCanvas, oppBoard, null);
        drawPreview(nextCtx, nextCanvas, nextPiece, false);
        drawPreview(holdCtx, holdCanvas, holdPiece, holdUsed);

        requestAnimationFrame(update);
    }

    function startGame() {
        initBoard();
        currentPiece = randomPiece();
        nextPiece = randomPiece();
        holdPiece = null;
        holdUsed = false;
        score = 0;
        lines = 0;
        dropInterval = 800;
        gameStarted = true;
        gameOver = false;
        imLost = false;
        oppLost = false;
        lastTime = 0;
        dropCounter = 0;
        document.getElementById("my-score").textContent = 0;
        document.getElementById("my-lines").textContent = 0;
        requestAnimationFrame(update);
    }

    /* 初期描画 */
    initBoard();
    drawBoard(myCtx, myCanvas, board, null);
    drawBoard(oppCtx, oppCanvas, oppBoard, null);
    drawPreview(nextCtx, nextCanvas, null, false);
    drawPreview(holdCtx, holdCanvas, null, false);

    /* CSRFトークン取得 */
    function getCookie(name) {
        var value = "; " + document.cookie;
        var parts = value.split("; " + name + "=");
        if (parts.length === 2) return parts.pop().split(";").shift();
        return "";
    }

    /* 勝利モーダル */
    function showWinModal(points, wins) {
        var modal = document.createElement("div");
        modal.style.cssText =
            "position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);" +
            "background:#111; color:#fff; padding:40px 60px; border-radius:16px;" +
            "text-align:center; z-index:99999; box-shadow:0 8px 40px rgba(0,0,0,0.5);" +
            "border:3px solid gold; min-width:300px;";

        modal.innerHTML =
            '<h1 style="margin:0 0 16px 0; color:gold; font-size:3rem;">🏆 VICTORY!</h1>' +
            '<p style="font-size:2rem; margin:8px 0; color:gold;">+100 pt 獲得！</p>' +
            '<p style="font-size:1.4rem; margin:8px 0; opacity:0.8;">所持ポイント: ' + points + ' pt</p>' +
            '<p style="font-size:1.2rem; margin:8px 0 24px 0; opacity:0.6;">通算 ' + wins + ' 勝</p>' +
            '<a href="/soso/tetrisGacha/" style="display:inline-block; padding:14px 32px; background:gold; color:#111; border-radius:8px; font-weight:700; text-decoration:none; font-size:1.4rem;">🎮 テトリスガチャを引く！</a>' +
            '<br><br>' +
            '<a href="/soso/vs/" style="color:#fff; opacity:0.7; font-size:1.2rem;">もう一度対戦する</a>';

        document.body.appendChild(modal);
    }
})();
</script>
</body>
</html>
