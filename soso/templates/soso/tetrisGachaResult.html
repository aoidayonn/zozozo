{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>テトリスガチャ結果</title>
    <link rel="stylesheet" type="text/css" href="{% static 'soso/css/zozo.css' %}" />
</head>
<body>
    <div class="content" style="text-align: center;">
        <h2>🎉 テトリスガチャ結果 🎉</h2>

        <div style="border: 3px solid gold; padding: 24px; margin: 20px auto; display: inline-block; border-radius: 12px; background: linear-gradient(135deg, #fff 0%, #fffbe0 100%);">
            <h1 style="margin: 0;">{{ coupon.rarity }}</h1>
            <h2 style="margin: 12px 0;">{{ coupon.discount_rate }}% OFF クーポン</h2>
            <p>クーポンコード:</p>
            <h3 style="background: #eee; padding: 12px; font-family: monospace; letter-spacing: 2px;">{{ coupon.code }}</h3>
            <p>有効期限: {{ coupon.expires_at|date:"Y/m/d H:i" }}</p>
        </div>

        <p>残りポイント: <strong>🎮 {{ remaining_points }} pt</strong></p>

        <br>
        <a href="{% url 'soso:tetris_gacha_page' %}">もう一度引く</a> |
        <a href="{% url 'soso:my_coupons' %}">マイクーポン一覧</a><br><br>
        <a href="{% url 'soso:tetris_lobby' %}">🎮 また対戦する</a> |
        <a href="{% url 'soso:top_page' %}">トップに戻る</a>
    </div>
</body>
</html>
