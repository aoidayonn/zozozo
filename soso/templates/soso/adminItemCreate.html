
{% extends "soso/base.html" %}
{% load static %}

{% block title %}商品登録{% endblock %}

{% block content %}

        <div class="content">
            <h3>商品登録</h3>
    
            {% if error %}
            <p style="color:red;">{{ error }}</p>
            {% endif %}
    
            <div class="form">
                <form action="{% url 'soso:admin_item_create' %}" method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <table>
                        {{ form.as_table }}
                    </table>
                    <input type="submit" value="登録" />
                </form>
            </div>
    
            <br>
            <a href="{% url 'soso:admin_item_list' %}">商品一覧に戻る</a>
        </div>
{% endblock %}
